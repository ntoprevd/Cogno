<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogno - 设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cogno: {
                            primary: '#E66A3C',
                            bg: '#FEFAF5',
                            surface: '#FFFFFF',
                            userBubble: '#F3E8E1',
                            text: '#2C2A27',
                            muted: '#9B9188',
                            line: '#EFE9E4',
                            darkPrimary: '#F28B62',
                            darkBg: '#141210',
                            darkSurface: '#1E1B18',
                            darkText: '#F0EBE6',
                            darkLine: '#2D2824',
                            darkUserBubble: '#2F2A26'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }

        .phone-shell {
            width: 390px;
            height: 844px;
            background: #FEFAF5;
            border-radius: 50px;
            border: 9px solid #1a1a1a;
            position: relative;
            margin: 20px auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            transition: background-color 0.3s;
        }

        .phone-shell.dark {
            background-color: #141210;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .btn-tap:active {
            transform: scale(0.96);
        }

        .transition-soft {
            transition: all 0.2s ease;
        }

        /* 菜单隐藏/显示 */
        .menu-hide {
            opacity: 0;
            transform: translateY(-10px) scale(0.95);
            pointer-events: none;
        }

        .menu-show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* 面板滑出动画 */
        #custom-api-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            opacity: 0;
        }

        #custom-api-panel.show {
            max-height: 800px;
            opacity: 1;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <div id="app-shell" class="phone-shell">
        <!-- 1. 状态栏 -->
        <div
            class="h-12 w-full flex justify-between items-center px-8 pt-5 text-cogno-text dark:text-cogno-darkText z-30">
            <span class="text-sm font-bold">9:41</span>
            <div class="flex gap-2 items-center text-xs">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-lg"></i>
            </div>
        </div>

        <!-- 2. 标题栏 -->
        <header class="h-14 flex items-center px-4 bg-transparent">
            <button onclick="window.location.href='index.html'"
                class="btn-tap transition-soft text-cogno-text dark:text-cogno-darkText p-2">
                <i class="fa-solid fa-chevron-left text-lg"></i>
            </button>
            <h1 class="text-[17px] font-bold text-cogno-text dark:text-cogno-darkText ml-2">设置</h1>
        </header>

        <!-- 3. 设置内容区 -->
        <main class="flex-1 overflow-y-auto px-5 py-2 no-scrollbar space-y-6 pb-10">

            <!-- 第一组：个人中心 -->
            <div
                class="bg-white dark:bg-cogno-darkSurface rounded-[22px] p-4 flex items-center gap-4 shadow-sm border border-transparent dark:border-cogno-darkLine">
                <div
                    class="w-14 h-14 rounded-full bg-cogno-primary dark:bg-cogno-darkPrimary flex items-center justify-center text-white text-xl font-bold">
                    JD</div>
                <div class="flex-1">
                    <h2 class="text-[16px] font-bold text-cogno-text dark:text-cogno-darkText">Jane Doe</h2>
                    <p class="text-[12px] text-cogno-muted">jane.doe@cogno.ai</p>
                </div>
                <i class="fa-solid fa-chevron-right text-cogno-line dark:text-cogno-muted text-xs"></i>
            </div>

            <!-- 第二组：AI 配置 -->
            <div class="relative">
                <h3 class="px-2 text-[12px] font-medium text-cogno-muted uppercase tracking-wider mb-2">AI 配置</h3>
                <div
                    class="bg-white dark:bg-cogno-darkSurface rounded-[22px] overflow-hidden shadow-sm border border-transparent dark:border-cogno-darkLine">
                    <!-- 模型选择 -->
                    <div onclick="toggleModelMenu(event)"
                        class="relative flex items-center justify-between px-4 py-4 border-b border-cogno-line dark:border-cogno-darkLine hover:bg-orange-50/30 dark:hover:bg-zinc-800 transition-soft cursor-pointer">
                        <span class="text-[15px] text-cogno-text dark:text-cogno-darkText">当前模型</span>
                        <div class="flex items-center gap-2">
                            <span id="current-model-name"
                                class="text-[14px] text-cogno-primary dark:text-cogno-darkPrimary font-medium">DeepSeek-V3</span>
                            <i class="fa-solid fa-chevron-right text-cogno-line dark:text-cogno-muted text-xs"></i>
                        </div>

                        <!-- 悬浮菜单：去除了图标，仅保留文字 -->
                        <div id="model-menu"
                            class="menu-hide absolute right-4 top-14 w-40 bg-white dark:bg-cogno-darkSurface border border-cogno-line dark:border-cogno-darkLine rounded-2xl shadow-xl z-50 transition-all duration-200 py-1 overflow-hidden">
                            <button onclick="selectModel('DeepSeek-V3')"
                                class="w-full text-left px-5 py-3 text-[13px] font-medium text-cogno-text dark:text-cogno-darkText hover:bg-cogno-bg dark:hover:bg-zinc-800 transition-colors">
                                DeepSeek-V3
                            </button>
                            <button onclick="selectModel('豆包')"
                                class="w-full text-left px-5 py-3 text-[13px] font-medium text-cogno-text dark:text-cogno-darkText hover:bg-cogno-bg dark:hover:bg-zinc-800 transition-colors">
                                豆包
                            </button>
                            <button onclick="selectModel('自定义 API')"
                                class="w-full text-left px-5 py-3 text-[13px] font-medium text-cogno-text dark:text-cogno-darkText hover:bg-cogno-bg dark:hover:bg-zinc-800 border-t border-cogno-line dark:border-cogno-darkLine transition-colors">
                                自定义 API
                            </button>
                        </div>
                    </div>
                    <!-- 系统提示词 -->
                    <div class="px-4 py-4">
                        <div class="flex justify-between mb-2">
                            <span class="text-[15px] text-cogno-text dark:text-cogno-darkText">系统提示词</span>
                        </div>
                        <textarea
                            class="w-full bg-cogno-bg dark:bg-cogno-darkBg rounded-xl p-3 text-[13px] text-cogno-text dark:text-cogno-darkText focus:outline-none placeholder:text-cogno-muted border-none"
                            rows="3" placeholder="定义 AI 的角色，例如：你是一个极简主义助手..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 联动部分：自定义 API 配置 + 消耗统计 -->
            <div id="custom-api-panel">
                <div class="space-y-6">
                    <!-- API 详情 -->
                    <div>
                        <h3 class="px-2 text-[12px] font-medium text-cogno-muted uppercase tracking-wider mb-2">API 配置
                        </h3>
                        <div
                            class="bg-white dark:bg-cogno-darkSurface rounded-[22px] overflow-hidden shadow-sm border border-transparent dark:border-cogno-darkLine">
                            <div class="px-4 py-4 border-b border-cogno-line dark:border-cogno-darkLine">
                                <label class="text-[11px] text-cogno-muted block mb-1 uppercase font-bold">Model
                                    ID</label>
                                <input type="text" placeholder="gpt-4-turbo..."
                                    class="w-full bg-transparent text-[14px] text-cogno-text dark:text-cogno-darkText focus:outline-none">
                            </div>
                            <div class="px-4 py-4 border-b border-cogno-line dark:border-cogno-darkLine">
                                <label class="text-[11px] text-cogno-muted block mb-1 uppercase font-bold">API Base
                                    URL</label>
                                <input type="text" value="https://api.deepseek.com/v1"
                                    class="w-full bg-transparent text-[14px] text-cogno-text dark:text-cogno-darkText focus:outline-none">
                            </div>
                            <div class="px-4 py-4">
                                <label class="text-[11px] text-cogno-muted block mb-1 uppercase font-bold">API
                                    Key</label>
                                <div class="flex items-center">
                                    <input type="password" value="sk-xxxxxxxxxxxxxxxx"
                                        class="flex-1 bg-transparent text-[14px] text-cogno-text dark:text-cogno-darkText focus:outline-none">
                                    <button class="text-cogno-muted hover:text-cogno-primary transition-soft">
                                        <i class="fa-regular fa-eye-slash text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 消耗统计 -->
                    <div>
                        <h3 class="px-2 text-[12px] font-medium text-cogno-muted uppercase tracking-wider mb-2">API 消耗统计
                            (本月)</h3>
                        <div
                            class="bg-white dark:bg-cogno-darkSurface rounded-[22px] p-5 shadow-sm border border-transparent dark:border-cogno-darkLine">
                            <div class="flex justify-between items-end mb-4">
                                <div>
                                    <p class="text-[10px] text-cogno-muted uppercase font-bold">Estimated Cost</p>
                                    <p class="text-2xl font-bold text-cogno-text dark:text-cogno-darkText">￥12.45</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] text-cogno-muted uppercase font-bold">Total Tokens</p>
                                    <p class="text-[14px] font-medium text-cogno-text dark:text-cogno-darkText">842.1k
                                    </p>
                                </div>
                            </div>
                            <div class="w-full bg-cogno-bg dark:bg-cogno-darkBg h-2 rounded-full overflow-hidden">
                                <div class="bg-cogno-primary dark:bg-cogno-darkPrimary h-full w-[65%] rounded-full">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第五组：显示与存储 -->
            <div>
                <h3 class="px-2 text-[12px] font-medium text-cogno-muted uppercase tracking-wider mb-2">显示与存储</h3>
                <div
                    class="bg-white dark:bg-cogno-darkSurface rounded-[22px] overflow-hidden shadow-sm border border-transparent dark:border-cogno-darkLine">
                    <div onclick="toggleDarkMode()"
                        class="flex items-center justify-between px-4 py-4 border-b border-cogno-line dark:border-cogno-darkLine cursor-pointer btn-tap transition-soft">
                        <span class="text-[15px] text-cogno-text dark:text-cogno-darkText">深色模式</span>
                        <i id="theme-toggle-icon"
                            class="fa-solid fa-toggle-off text-2xl text-cogno-muted dark:text-cogno-darkPrimary"></i>
                    </div>
                    <div
                        class="flex items-center justify-between px-4 py-4 border-b border-cogno-line dark:border-cogno-darkLine cursor-pointer btn-tap transition-soft">
                        <span class="text-[15px] text-cogno-text dark:text-cogno-darkText">语言</span>
                        <div class="flex items-center gap-1">
                            <span class="text-[14px] text-cogno-muted">简体中文</span>
                            <i class="fa-solid fa-chevron-right text-cogno-line dark:text-cogno-muted text-[10px]"></i>
                        </div>
                    </div>
                    <div
                        class="flex items-center justify-between px-4 py-4 hover:bg-red-50 dark:hover:bg-red-900/20 transition-soft cursor-pointer">
                        <span class="text-[15px] text-red-500">清理本地缓存</span>
                        <span class="text-[12px] text-cogno-muted">24.5 MB</span>
                    </div>
                </div>
            </div>

            <!-- 关于 -->
            <div class="text-center py-4">
                <p class="text-[12px] text-cogno-muted">Cogno v1.1.0-stable</p>
                <div
                    class="flex justify-center gap-4 mt-2 text-[12px] text-cogno-primary dark:text-cogno-darkPrimary font-medium">
                    <span>隐私协议</span>
                    <span class="text-cogno-line dark:text-cogno-darkLine">|</span>
                    <span>服务条款</span>
                </div>
            </div>

        </main>
    </div>

    <script>
        // 切换模型菜单
        function toggleModelMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('model-menu');
            menu.classList.toggle('menu-show');
            menu.classList.toggle('menu-hide');
        }

        // 选择模型
        function selectModel(name) {
            document.getElementById('current-model-name').innerText = name;
            const panel = document.getElementById('custom-api-panel');

            // 如果选择“自定义 API”，显示面板，否则隐藏
            if (name === '自定义 API') {
                panel.classList.add('show');
            } else {
                panel.classList.remove('show');
            }

            // 关闭菜单
            const menu = document.getElementById('model-menu');
            menu.classList.add('menu-hide');
            menu.classList.remove('menu-show');
        }

        // 点击外部关闭菜单
        window.onclick = function () {
            const menu = document.getElementById('model-menu');
            if (menu.classList.contains('menu-show')) {
                menu.classList.add('menu-hide');
                menu.classList.remove('menu-show');
            }
        }

        function toggleDarkMode() {
            const shell = document.getElementById('app-shell');
            const icon = document.getElementById('theme-toggle-icon');
            shell.classList.toggle('dark');
            const isDark = shell.classList.contains('dark');
            localStorage.setItem('cogno-dark-mode', isDark);

            if (isDark) {
                icon.classList.remove('fa-toggle-off');
                icon.classList.add('fa-toggle-on');
            } else {
                icon.classList.remove('fa-toggle-on');
                icon.classList.add('fa-toggle-off');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('cogno-dark-mode') === 'true') {
                document.getElementById('app-shell').classList.add('dark');
                const icon = document.getElementById('theme-toggle-icon');
                if (icon) {
                    icon.classList.remove('fa-toggle-off');
                    icon.classList.add('fa-toggle-on');
                }
            }
        });
    </script>
</body>

</html>
